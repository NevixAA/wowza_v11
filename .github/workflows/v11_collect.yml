name: V11 Collect

# Data-collection only. Reads v9's PUBLIC data and records what the market-first engine WOULD
# decide. No Telegram, no dashboard, no stakes. Cannot affect v9 — v11 reads v9 and never
# writes to it, and if v11 fails v9 is unaffected (Prompt 3 section 3).
#
# Outputs:
#   output/v11_shadow_snapshots.csv  APPEND-ONLY immutable research history
#   output/v11_shadow_log.csv        latest-per-fixture view (what grade/residual consume)
#   output/v11_graded.csv, v11_scoreboard.csv, v11_residual.csv

on:
  schedule:
    # CUT 32/day -> 16/day on 2026-08-30. Twice an hour was never buying anything: v11 reads v9's
    # COMMITTED output, so it can never observe faster than v9 publishes, and v9's predict was
    # itself delivering only ~9 runs a day. Sampling a source twice as often as it updates just
    # re-reads the same file.
    #
    # It was also not being honoured. Measured across the estate over 72h, configured vs delivered:
    # anything at or below 8 runs/day landed essentially in full, anything at or above 26/day
    # landed 8-38%. This workflow asked for 32 and delivered 3 — and every one of those dropped
    # requests was competing with v9's odds capture, whose prices cannot be backfilled.
    - cron: '25 8-23 * * *'   # hourly during match hours
  workflow_dispatch:

concurrency:
  group: v11-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Read v9 from a CHECKOUT, not raw.githubusercontent.com. Unauthenticated raw fetches
      # are rate-limited, and this job pulls several files twice an hour: on 2026-08-17 a
      # plain fetch returned 429 Too Many Requests, which the collector turned into an
      # unhandled HTTPError. v11's snapshot history stops at 2026-08-11T09:26, six days
      # earlier, which that explains. A shallow public clone costs nothing and cannot be
      # throttled. v11 still only READS it.
      - name: Check out v9 baseline (read-only)
        uses: actions/checkout@v4
        with:
          repository: NevixAA/wowza-betting
          ref: main
          path: _v9
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas numpy requests

      - name: Collect V11 shadow snapshot
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: python scripts/v11_shadow.py

      - name: Grade + scoreboard (v9 vs v11 on settled fixtures)
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: python scripts/v11_grade.py

      # Measure N_EFF and ECE from settled outcomes, replacing the hardcoded 1000 / 0.02.
      # Runs BEFORE the residual test so that test uses the measured values. If there is not
      # enough settled history it writes nothing and the conservative fallback stands.
      - name: Fit measured evidence (N_EFF, ECE)
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: python scripts/v11_fit_evidence.py

      - name: Residual-vs-market experiment (does the model beat the market?)
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: python scripts/v11_residual.py

      # Does the market move TOWARD Wowza when they disagree (Prompt 3 section 16)? Only
      # computable since the snapshot history stopped being deleted every 30 minutes.
      - name: Market movement vs initial disagreement
        id: movement
        run: python scripts/v11_market_movement.py

      # Microstructure: backward-looking price context (velocity, momentum, dispersion) with
      # every segment scored against a model-free placebo. Runs AFTER the movement step because
      # it joins onto v11_market_movement_detail.csv by snapshot_id.
      - name: Market microstructure + placebo controls
        id: microstructure
        run: python scripts/v11_microstructure.py

      # THE CONTROLLED VERSION OF THE HEADLINE (Prompt 02 section 2). The movement step above
      # reports a 57.9% fixture-level toward-Wowza rate; this one asks whether that survives
      # once prior momentum is in the model, and whether it survives a placebo residual at all.
      #
      # EVERY NUMBER THIS COMMENT USED TO QUOTE WAS VOID. It cited "+1.2033 uncontrolled to
      # +0.0005 controlled, placebo +0.7300" from the 2026-08-30 run. Those came from a
      # `merge_asof` index-reset bug in `_asof`/`_asof_col` that put every movement value on the
      # wrong row — see the comment at v11_momentum_control.py:_asof. Fixed 2026-09-10.
      #
      # Re-run on the corrected code, 36,107 snapshots / 368 fixtures, the answer is more
      # interesting than either the broken version or the story built on it:
      #
      #   * The residual coefficient SURVIVES full controls: +0.0012, CI [+0.0003, +0.0022],
      #     p=0.006 (uncontrolled +0.0009). So the model is not pure noise.
      #   * But it is economically negligible — worth a fraction of a point of price against a
      #     ~7% spread — and the shuffled-model placebo still reproduces 42% of it, so the
      #     shared-p_market(t) artefact is real even if it is not the whole effect.
      #   * The toward-rate framing is worthless: v9 scores 0.076 while FOUR controls carrying
      #     no football information beat it (mean reversion 0.805, momentum continuation 0.795,
      #     long momentum 0.708, dispersion 0.293).
      #   * Chronologically, significant in 1 of 4 expanding-window folds.
      #
      # Scheduled rather than run by hand precisely so this keeps being re-tested as the sample
      # grows instead of being remembered as settled — which is exactly what happened to the
      # broken numbers above. Quote the CSVs, not a comment.
      - name: Momentum-controlled residual regression
        id: momentum
        run: python scripts/v11_momentum_control.py --write
        continue-on-error: true

      # FAIL LOUDLY (brief section 12). Raw collection succeeding while derived research stays
      # frozen is exactly the failure this whole change addresses, and for two days it presented
      # as a fully green workflow. The research clock compares each derived artifact's
      # generated_at against its source's newest observation, so "no new eligible data" and
      # "the analysis did not refresh" are distinguishable rather than both looking like an
      # unchanged file.
      #
      # Runs BEFORE the commit so the state files are committed with everything else, and is
      # NOT continue-on-error: a stale-research verdict must colour the run.
      - name: Research freshness clock
        id: research_clock
        run: python -m src.research_state

      - name: Commit logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # v11_shadow_snapshots.csv is the append-only research history and MUST be committed
          # — it is the season's actual product.
          # THE DERIVED MOVEMENT FILES WERE MISSING FROM THIS LIST — the root cause of stale
          # research (found 2026-08-25). The movement script was rewritten on 08-23 to emit six
          # files instead of one, and this list was never updated, so CI recomputed all six on
          # every run for two days and then DISCARDED them:
          #
          #     raw snapshots           last commit 2026-08-25 09:56  (CI, current)
          #     the six movement files  last commit 2026-08-23 14:01  (me, by hand)
          #
          # It also still staged output/v11_market_movement.csv, a filename the rewritten script
          # no longer writes — so the list pointed at a dead file while omitting the live ones.
          # Nothing failed: `git add -f` on an unchanged path is a no-op, `|| true` swallowed it,
          # and the workflow went green with fresh raw data and frozen conclusions.
          #
          # Adding a new derived output now means adding it HERE. research_state.json is the
          # guard against forgetting again: it records every derived file's generated_at, and the
          # freshness contract fails when one lags its source.
          for f in output/v11_shadow_snapshots.csv output/v11_shadow_log.csv \
                   output/v11_graded.csv output/v11_scoreboard.csv output/v11_residual.csv \
                   output/v11_evidence.json \
                   output/v11_market_movement_detail.csv \
                   output/v11_movement_summary.csv \
                   output/v11_movement_by_residual.csv \
                   output/v11_movement_by_model.csv \
                   output/v11_movement_by_time.csv \
                   output/v11_movement_by_league.csv \
                   output/v11_market_microstructure.csv \
                   output/v11_microstructure_segments.csv \
                   output/v11_microstructure_coverage.csv \
                   output/v11_momentum_control.csv \
                   output/v11_momentum_roles.csv \
                   output/v11_placebo_table.csv \
                   output/v11_chronological_folds.csv \
                   output/v11_research_health.json output/research_state.json; do
            git add -f "$f" 2>/dev/null || echo "  (skip, not present: $f)"
          done
          echo "staged: $(git diff --staged --name-only | wc -l) file(s)"
          git diff --staged --quiet || \
            git commit -m "auto: v11 collect+grade $(date -u '+%Y-%m-%d %H:%M UTC')"
          # A push failure used to be swallowed by `|| echo "nothing to push"`, so a run that
          # never persisted its data still reported success. Retry the race, then FAIL.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          echo "::error title=V11 push failed::Snapshots were collected but not persisted."
          exit 1

      # LAST, and deliberately AFTER the commit. Placed before it, a stale verdict exited
      # non-zero and the commit step never ran — so the freshly collected snapshots were
      # DISCARDED as a side effect of reporting that the analysis was stale. Odds snapshots
      # cannot be re-collected, so persisting always comes first; the run still goes red.
      - name: Fail the run if research did not refresh
        if: always() && steps.research_clock.outcome == 'success'
        run: |
          python - <<'PY'
          import json, sys
          h = json.load(open("output/v11_research_health.json", encoding="utf-8"))
          print(f"research health: {h['overall']}")
          for c in h.get("checks", []):
              if c["status"] != "PASS":
                  print(f"  [{c['status']}] {c['artifact']}: {c['why']}")
          if h["overall"] == "FAIL":
              # ::error makes it visible in the run summary, not just buried in a log.
              print("::error title=V11 research stale::Raw collection advanced but derived "
                    "research did not refresh. See output/v11_research_health.json")
              sys.exit(1)
          PY
